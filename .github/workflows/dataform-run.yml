name: Dataform CI/CD Trigger

on:
  push:
    branches:
      - test
    paths:
      - 'definitions/**'
      - 'dataform.json'

jobs:
  execute-dataform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          # 重點：強制安裝 dataform 組件
          install_components: 'beta,dataform'

      - name: Run Dataform Workflow
        # 修正：移除重複的指令列，只保留一組正確的指令
        run: |
          gcloud dataform workflows run \
            --project=jchuang-project \
            --location=asia-east1 \
            --repository=ding