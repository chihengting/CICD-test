name: 自動執行 Dataform SQLX

on:
  push:
    branches:
      - test  # 當推播到 main 分支時觸發

env:
  PROJECT_ID: jchuang-project
  LOCATION: asia-east1
  REPOSITORY: cicd-test

jobs:
  run-dataform:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 設定 Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: 執行 Dataform API (編譯 + 執行)
        run: |
          echo "1. 呼叫 API：建立 Compilation Result (編譯最新的 main 分支)..."
          COMPILATION_RESULT=$(gcloud dataform compilation-results create \
            --project=${{ env.PROJECT_ID }} \
            --location=${{ env.LOCATION }} \
            --repository=${{ env.REPOSITORY }} \
            --git-commitish=main \
            --format="value(name)")
          
          echo "編譯結果 ID: $COMPILATION_RESULT"

          echo "2. 呼叫 API：建立 Workflow Invocation (開始執行 SQLX)..."
          # 這裡會執行整個專案。如果你只想執行特定的 SQLX，可以加上 --tags 或其他參數
          gcloud dataform workflow-invocations create \
            --project=${{ env.PROJECT_ID }} \
            --location=${{ env.LOCATION }} \
            --repository=${{ env.REPOSITORY }} \
            --compilation-result=$COMPILATION_RESULT

          echo "🚀 Dataform 執行已觸發！"