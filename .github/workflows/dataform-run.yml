name: Dataform CI/CD Trigger

on:
  push:
    branches:
      - test  # <--- 已改為偵測 test 分支
    paths:
      - 'definitions/**'
      - 'dataform.json'

jobs:
  execute-dataform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 認證 Google Cloud (使用你存放在 GitHub Secrets 的 JSON Key)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. 設定 Cloud SDK 並安裝 beta 組件
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'beta'

      # 3. 執行 Dataform Workflow
      - name: Run Dataform Workflow
        run: |
          gcloud beta dataform workflows run \
            --project=jchuang-project \
            --location=asia-east1 \
            --repository=ding