name: Dataform CI/CD Trigger

on:
  push:
    branches:
      - test  # 偵測 test 分支
    paths:
      - '**/*.sqlx'    # 偵測專案內任何 .sqlx 的變動
      - 'dataform.json'
      - 'package.json'

jobs:
  execute-dataform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 使用 JSON 金鑰進行認證
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. 強制安裝最新版 Cloud SDK (包含 Dataform GA 指令)
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 432.0.0' # 確保版本夠新才支援 dataform 指令

      # 3. 執行 Dataform Workflow
      - name: Run Dataform Workflow
        run: |
          gcloud dataform workflows run \
            --project=jchuang-project \
            --location=asia-east1 \
            --repository=ding