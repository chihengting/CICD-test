name: Dataform CI/CD Trigger

on:
  push:
    branches:
      - test  # 偵測 test 分支
    paths:
      - '**/*.sqlx'
      - 'dataform.json'
      - 'package.json'

jobs:
  execute-dataform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 認證 Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. 設定 Cloud SDK (用來產生 Token)
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. 透過 REST API 觸發 Dataform
      - name: Trigger Dataform Execution via API
        run: |
          # 取得 GCP 授權 Token
          TOKEN=$(gcloud auth print-access-token)
          
          echo "===== 步驟 1: 開始編譯 Dataform (Compilation) ====="
          COMPILATION_RES=$(curl -s -X POST -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"gitCommitish": "test"}' \
            "https://dataform.googleapis.com/v1beta1/projects/jchuang-project/locations/asia-east1/repositories/ding/compilationResults")
          
          # 解析回傳的 JSON 取得編譯結果的 ID
          COMPILATION_NAME=$(echo $COMPILATION_RES | jq -r '.name')
          
          if [ "$COMPILATION_NAME" == "null" ] || [ -z "$COMPILATION_NAME" ]; then
            echo "❌ 編譯失敗！請檢查錯誤訊息："
            echo $COMPILATION_RES
            exit 1
          fi
          
          echo "✅ 編譯成功！編譯 ID: $COMPILATION_NAME"
          
          echo "===== 步驟 2: 開始執行工作流程 (Workflow Invocation) ====="
          INVOCATION_RES=$(curl -s -X POST -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"compilationResult\": \"$COMPILATION_NAME\"}" \
            "https://dataform.googleapis.com/v1beta1/projects/jchuang-project/locations/asia-east1/repositories/ding/workflowInvocations")
          
          INVOCATION_NAME=$(echo $INVOCATION_RES | jq -r '.name')
          
          if [ "$INVOCATION_NAME" == "null" ] || [ -z "$INVOCATION_NAME" ]; then
            echo "❌ 啟動執行失敗！請檢查錯誤訊息："
            echo $INVOCATION_RES
            exit 1
          fi
          
          echo "✅ 成功啟動 Dataform 執行！執行 ID: $INVOCATION_NAME"
          echo "🎉 現在你可以前往 GCP Console 的 Dataform 介面查看執行進度了！"